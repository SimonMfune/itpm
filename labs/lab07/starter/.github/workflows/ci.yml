name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test-analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, needed for new-code analysis
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests with coverage
        run: pytest --cov=. --cov-report=xml
      # Step 2 of the lab: add SonarQube analysis here once your project
      # and SONAR_TOKEN secret are set up. See the lab README.
